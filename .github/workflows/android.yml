# 안드로이드 APK 빌드와 배포.
#
#  - main 에 올릴 때마다: APK 를 만들어 Actions 아티팩트로 남긴다.
#    (저장소에 로그인한 사람만 받을 수 있다)
#  - 수동 실행(Run workflow): 같은 APK 를 "latest" 릴리스에 올린다.
#    링크가 늘 같으므로 친구에게 한 번만 알려 주면 된다. 공개 저장소라
#    이 링크는 누구나 열 수 있다.
#
# Supabase 키는 저장소에 없다. Secrets 에서 환경 변수로 넣는다.
# 없으면 친구 기능이 꺼진 채로 빌드된다 (앱은 로컬 전용으로 동작).

name: Android

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "latest 릴리스에 APK 올리기 (공개 다운로드 링크가 생깁니다)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 풀기 (있을 때만)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=release.keystore" >> "$GITHUB_ENV"
            echo "서명 키를 씁니다."
          else
            echo "서명 키가 없어 디버그 키로 서명합니다. 설치는 됩니다."
          fi

      - name: APK 빌드
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 이름 붙이기
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/관제스케줄러.apk"
          ls -lh dist

      - name: 키가 들어갔는지 확인
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "Supabase 키를 넣고 빌드했습니다 — 친구 기능이 켜집니다."
          else
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY secrets 가 없어 친구 기능이 꺼진 APK 입니다."
          fi

      - name: 아티팩트로 보관
        uses: actions/upload-artifact@v4
        with:
          name: 관제스케줄러-apk
          path: dist/관제스케줄러.apk
          retention-days: 90

      - name: latest 릴리스에 올리기
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "dist/관제스케줄러.apk" \
            --title "관제 스케줄러 (최신)" \
            --notes "$(cat <<'NOTES'
          안드로이드용 APK 입니다. 받아서 열면 설치됩니다.

          **설치 방법**
          1. 아래 `관제스케줄러.apk` 를 눌러 받습니다
          2. "출처를 알 수 없는 앱 설치" 를 허용합니다
          3. 삼성 기기는 Play 프로텍트가 한 번 묻습니다 — "무시하고 설치"

          **처음 켰을 때**
          근무 형태와 교대 근무 시작일을 고르면 근무표가 만들어집니다.
          친구와 근무표를 나누려면 설정 → 친구 근무표에서 아이디를 만들고,
          서로 아이디를 추가해 수락하면 됩니다.

          근무표·일정·점검은 기기 안에만 저장됩니다. 로그인했을 때만 근무표가
          서버에 올라가고, 그것도 친구로 수락한 사람에게만 보입니다.
          NOTES
          )"
          echo "받는 곳: ${{ github.server_url }}/${{ github.repository }}/releases/latest"
